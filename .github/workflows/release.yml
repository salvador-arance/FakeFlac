name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: npm ci
      - name: Tag matches versions
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (($pkg -ne $tag) -or ($tauri -ne $tag) -or ($cargo -ne $tag)) { throw "Version mismatch: tag=$tag package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo" }
      - run: just ci

  release:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build
      - name: Checksums
        shell: pwsh
        run: |
          $out = "SHA256SUMS.txt"
          Get-ChildItem target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Add-Content $out
          }
          Get-Content $out
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      - name: Draft release (the human publishes it)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Unsigned build (ADR-0032). Windows SmartScreen may warn on first run: click 'More info' then 'Run anyway'. Verify the download against SHA256SUMS.txt."
          gh release create "${{ github.ref_name }}" --draft --generate-notes --notes "$notes" `
            (Get-ChildItem target/release/bundle/nsis/*.exe).FullName `
            (Get-ChildItem target/release/bundle/msi/*.msi).FullName `
            SHA256SUMS.txt