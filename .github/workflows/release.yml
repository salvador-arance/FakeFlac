name: Release

# RNF-11, RNF-06, ADR-0045, specs/contracts/release.md section 5.2.
# A tag push (only the human tags) verifies, packages and leaves a draft release; the human
# publishes it. A manual run (workflow_dispatch) is a dry run that verifies and packages, and never
# publishes.
# Every step only calls `just` recipes or `npm ci`; the tag reaches the script through
# GITHUB_REF_NAME, never through an expression in a command line.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "rustfmt, clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: extractions/setup-just@v4
      - run: npm ci
      - name: The tag names the manifests' version and is on main
        if: github.event_name == 'push'
        run: just release-check
      - name: The manifests agree on a releasable version (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: just version-check
      - run: just ci

  package:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: extractions/setup-just@v4
      - run: npm ci
      - run: just build
      - name: Installer size gate (RNF-06), checksums and release notes
        run: just release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: target/release-staging/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: extractions/setup-just@v4
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: target/release-staging
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/release-staging/assets/*.exe
            target/release-staging/assets/*.msi
      - name: Draft release (the human publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: just release-draft
