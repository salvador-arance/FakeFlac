name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR replaces its previous run. On `main` every merge gets its own group (by
# commit), so quick consecutive merges never cancel or drop each other's runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: npm ci
      - run: just check-fast

  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: extractions/setup-just@v4
      - run: just trace
      - run: just lint-arch
      - run: just guard-tests
      - run: just version-check
      # S3 (contract drift) runs in build-windows (`just check-app`): generating needs Tauri.

  # Windows only: v1 ships for Windows (RNF-07). Platform-independent jobs stay on Linux.
  test-rust:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest" }
      - run: cargo nextest run --workspace --exclude fakeflac --no-tests=pass
      - run: cargo test --workspace --exclude fakeflac --doc

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run build

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-deny,cargo-audit" }
      - run: cargo deny check
      - run: cargo audit
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target" }
      - uses: extractions/setup-just@v4
      - run: npm ci
      - name: Tauri adapter checks (clippy, tests, bindings up to date)
        run: just check-app
      - run: just build
      - name: Installer size gate (RNF-06), checksums and release notes
        run: just release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: target/release-staging/
          retention-days: 7
          if-no-files-found: error

  # Single required check for branch protection.
  ci-ok:
    if: always()
    needs: [lint, specs, test-rust, test-web, supply-chain, build-windows]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi