[workspace]
resolver = "2"
members = [
    "crates/fakeflac-core",
    "crates/fakeflac-audio",
    "crates/fakeflac-fs",
    "crates/fakeflac-store",
    "crates/fakeflac-export",
    "src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/salvador-arance/FakeFlac"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

# Optimise dependencies in dev/test builds: DSP and decoding tests are too slow unoptimised.
[profile.dev.package."*"]
opt-level = 3
