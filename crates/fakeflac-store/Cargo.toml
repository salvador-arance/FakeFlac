[package]
name = "fakeflac-store"
description = "SQLite result cache adapter."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
# float_roundtrip: the f32 values of a stored analysis read back bit for bit (result-cache.md 2.1, ADR-0044).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
fakeflac-core = { path = "../fakeflac-core" }
# SQLite compiled into the binary (ADR-0007, ADR-0044 decision 5).
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true
