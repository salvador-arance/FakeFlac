# Grid for /calibrate v3 (RP-11, ADR-0036). Spec: specs/calibration/evaluation.md section 7; calibration.md OQ-18 to OQ-21.
# Baseline: detection v8, the parameters the app ships. Default of --grid. Searches the full-band guard ([full_band])
# together with the gap threshold it guards. Not verdict.step_fake_db: lossy.fake_min_step_db is tied to it and the
# search never changes [lossy] (OQ-22). [edge] and [lossy] are copied unchanged into a proposal.
# Only rule parameters may appear in [values]; the search reads tune rows only.
grid_version = 3
baseline = "specs/detection/detection-params.v8.toml"
must_catch = ["cbr128", "cbr192"]     # hard constraints: no must_catch tune positive that the baseline catches becomes Real (OQ-19), AND no confirmed fake is Real (OQ-11)
max_points = 100000

[weights]                             # same weights as grid v1 (OQ-11)
fp = 10.0
fn = 1.0
suspicious_negative = 0.5
suspicious_positive = 0.1

[values]                              # around v8; 3 x 3 x 3 = 27 points before invariants
"full_band.min_level_db" = [-80.0, -70.0, -60.0]
"full_band.min_burst_db" = [2.0, 3.0, 4.0]
"verdict.gap_fake_db" = [5.0, 6.0, 7.0]
