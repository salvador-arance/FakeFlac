# cargo-deny: licences, advisories, sources (R11).
[graph]
# v1 ships for Windows only (RNF-07). Linux-only transitive crates of Tauri (gtk stack, e.g. the
# unmaintained proc-macro-error, RUSTSEC-2024-0370) are not part of the shipped artefact.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
ignore = [
    # `paste` is archived (unmaintained), not vulnerable. It is a build-time proc-macro required by
    # specta 2.0.0-rc.25 (ADR-0033). Revisit when specta drops it or a vulnerability appears.
    { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro of specta; unmaintained, no known vulnerability (ADR-0033)" },
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"